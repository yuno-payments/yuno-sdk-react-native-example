---
format_version: '23'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native
workflows:
  generateQaVersion:
    description: |
      Generates QA Android APK and uploads to Firebase App Distribution.
      Uses public npm registry (@yuno-payments/yuno-sdk-react-native).
      
      Required Secrets:
      - FIREBASE_TOKEN (Firebase CLI token - get it via: firebase login:ci)
      - FIREBASE_APP_ID (Use: 1:744979953259:android:5e06daf454d662b202232e for com.yunosdkexample)
      
      Optional Secrets:
      - FIREBASE_TESTER_GROUPS (comma-separated group names)
    steps:
    - git-clone@8: {}
    
    - cache-pull@2: {}
    
    - npm@1:
        title: Install NPM Dependencies
        inputs:
        - workdir: "$WORKDIR"
        - command: install
    
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    
    - android-build@1:
        title: Build Android APK (Debug)
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: "$MODULE"
        - variant: "$VARIANT"
    
    - script@1:
        title: Verify APK was created
        inputs:
        - content: |
            #!/bin/bash
            set -e
            
            echo "🔍 Looking for generated APK..."
            if [ -f "$BITRISE_APK_PATH" ]; then
              echo "✅ APK found: $BITRISE_APK_PATH"
              ls -lh "$BITRISE_APK_PATH"
            else
              echo "❌ APK not found at: $BITRISE_APK_PATH"
              echo "Looking for APKs in android/app/build/outputs/apk/..."
              find android/app/build/outputs/apk/ -name "*.apk" || true
              exit 1
            fi
    
    - firebase-app-distribution@0:
        title: Deploy to Firebase App Distribution
        inputs:
        - firebase_token: "$FIREBASE_TOKEN"
        - app: "$FIREBASE_APP_ID"
        - app_path: "$BITRISE_APK_PATH"
        - release_notes: |
            🚀 QA Build - Yuno SDK React Native Example
            
            📦 Build: #$BITRISE_BUILD_NUMBER
            🌿 Branch: $BITRISE_GIT_BRANCH
            📝 Commit: $BITRISE_GIT_COMMIT
            👤 By: $GIT_CLONE_COMMIT_AUTHOR_NAME
            
            Ready for testing! 🧪
        - groups: "$FIREBASE_TESTER_GROUPS"
    
    - deploy-to-bitrise-io@2:
        title: Deploy APK to Bitrise Artifacts
        inputs:
        - deploy_path: "$BITRISE_APK_PATH"
        - is_compress: "false"
    
    - cache-push@2:
        inputs:
        - cache_paths: |
            $HOME/.gradle/caches
            $HOME/.gradle/wrapper
            ./android/.gradle
  
  deploy:
    description: |
      Tests, builds and deploys the app using *Deploy to bitrise.io* Step.

      Next steps:
      - Set up an [Apple service with API key](https://devcenter.bitrise.io/en/accounts/connecting-to-services/connecting-to-an-apple-service-with-api-key.html).
      - Check out [Getting started with React Native apps](https://devcenter.bitrise.io/en/getting-started/getting-started-with-react-native-apps.html).
    steps:
    - git-clone@8: {}
    - npm@1:
        title: npm install
        inputs:
        - workdir: "$WORKDIR"
        - command: install
    - npm@1:
        title: npm test
        inputs:
        - workdir: "$WORKDIR"
        - command: test
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - android-build@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: "$MODULE"
        - variant: "$VARIANT"
    - cocoapods-install@2:
        inputs:
        - is_cache_disabled: 'true'
    - xcode-archive@5:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - distribution_method: "$BITRISE_DISTRIBUTION_METHOD"
        - configuration: Release
        - automatic_code_signing: api-key
    - deploy-to-bitrise-io@2: {}
  
  testflight-deploy:
    description: |
      Builds iOS app and automatically uploads to TestFlight.
      
      Requirements:
      - Apple Developer Connection configured with API Key in Bitrise
      - App created in App Store Connect
      - Bundle ID must match: org.reactjs.native.example.YunoSDKExample
      
      This workflow will:
      1. Install dependencies
      2. Install CocoaPods
      3. Create iOS archive
      4. Export .ipa
      5. Upload to TestFlight automatically
    steps:
    - git-clone@8: {}
    
    - cache-pull@2: {}
    
    - npm@1:
        title: Install NPM Dependencies
        inputs:
        - workdir: "$WORKDIR"
        - command: install
    
    - script@1:
        title: Run postinstall script and setup Node.js
        inputs:
        - content: |
            #!/bin/bash
            set -e
            echo "Running postinstall script..."
            bash ./scripts/fix-boost-checksum.sh || true
            echo "✅ Postinstall completed"
            
            # Ensure Node.js is available for Xcode build phases
            echo "Setting up Node.js for Xcode..."
            NODE_PATH=$(command -v node || which node || echo "")
            if [ -z "$NODE_PATH" ]; then
              echo "⚠️ Node.js not found in PATH, trying common locations..."
              if [ -f "/usr/local/bin/node" ]; then
                export PATH="/usr/local/bin:$PATH"
              elif [ -f "/opt/homebrew/bin/node" ]; then
                export PATH="/opt/homebrew/bin:$PATH"
              fi
            fi
            
            # Verify Node.js is available
            if command -v node >/dev/null 2>&1; then
              echo "✅ Node.js found: $(command -v node)"
              echo "✅ Node.js version: $(node --version)"
            else
              echo "❌ Node.js not found!"
              exit 1
            fi
    
    - cocoapods-install@2:
        title: Install CocoaPods
        inputs:
        - podfile_path: ios/Podfile
        - is_cache_disabled: 'false'
    
    - certificate-and-profile-installer@1:
        title: Install Certificates and Profiles
        inputs:
        - connection_type: 'automatic'
        - distribution_type: 'app-store'
    
    - xcode-archive@5:
        title: Create iOS Archive and Export IPA
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - distribution_method: app-store
        - configuration: Release
        - automatic_code_signing: api-key
        - team_id: "6FHH4JXB2X"
        - export_options_plist_content: |
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>uploadSymbols</key>
                <true/>
                <key>uploadBitcode</key>
                <false/>
                <key>compileBitcode</key>
                <false/>
                <key>signingStyle</key>
                <string>automatic</string>
            </dict>
            </plist>
    
    - script@1:
        title: Upload to TestFlight
        inputs:
        - content: |
            #!/bin/bash
            set -e
            
            echo "📤 Uploading IPA to TestFlight..."
            
            if [ -z "$BITRISE_IPA_PATH" ]; then
              echo "❌ BITRISE_IPA_PATH not found"
              exit 1
            fi
            
            if [ ! -f "$BITRISE_IPA_PATH" ]; then
              echo "❌ IPA file not found at: $BITRISE_IPA_PATH"
              echo "Searching for IPA files..."
              find . -name "*.ipa" -type f 2>/dev/null || true
              exit 1
            fi
            
            echo "✅ IPA found: $BITRISE_IPA_PATH"
            ls -lh "$BITRISE_IPA_PATH"
            
            # Upload using xcrun altool
            # Bitrise automatically provides credentials when Apple Service is connected
            echo "Uploading to App Store Connect..."
            xcrun altool --upload-app \
              --type ios \
              --file "$BITRISE_IPA_PATH" \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --verbose || {
              echo "❌ Upload failed"
              echo ""
              echo "Troubleshooting:"
              echo "1. Verify Apple Service is connected in Bitrise Settings > Connected services"
              echo "2. Check that APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_ISSUER_ID are set"
              echo "3. Verify the API Key has App Manager or Admin permissions"
              echo ""
              echo "IPA is available in artifacts for manual upload: $BITRISE_IPA_PATH"
              exit 1
            }
            
            echo "✅ IPA uploaded to TestFlight successfully!"
    
    - deploy-to-bitrise-io@2:
        title: Deploy IPA to Bitrise Artifacts
        inputs:
        - deploy_path: "$BITRISE_IPA_PATH"
        - is_compress: "false"
    
    - cache-push@2:
        inputs:
        - cache_paths: |
            $HOME/.npm
            $HOME/.cocoapods
            ios/Pods
    triggers:
      tag:
      - name:
          regex: "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[a-zA-Z]+)?-[0-9]+-DEV$"
  primary:
    description: |
      Runs tests.

      Next steps:
      - Check out [Getting started with React Native apps](https://devcenter.bitrise.io/en/getting-started/getting-started-with-react-native-apps.html).
    steps:
    - git-clone@8: {}
    - restore-npm-cache@2: {}
    - npm@1:
        title: npm install
        inputs:
        - workdir: "$WORKDIR"
        - command: install
    - npm@1:
        title: npm test
        inputs:
        - workdir: "$WORKDIR"
        - command: test
    - save-npm-cache@1: {}
    - deploy-to-bitrise-io@2: {}
    triggers:
      push:
      - branch: main
      pull_request:
      - source_branch: "*"
meta:
  bitrise.io:
    stack: osx-xcode-16.4.x
    machine_type_id: g2-m1.8core
app:
  envs:
  - WORKDIR: "."
    opts:
      is_expand: false
  - PROJECT_LOCATION: android
    opts:
      is_expand: false
  - MODULE: app
    opts:
      is_expand: false
  - VARIANT: Debug
    opts:
      is_expand: false
  - BITRISE_PROJECT_PATH: ios/YunoSDKExample.xcworkspace
    opts:
      is_expand: false
  - BITRISE_SCHEME: YunoSDKExample
    opts:
      is_expand: false
  - BITRISE_DISTRIBUTION_METHOD: app-store
    opts:
      is_expand: false
  - BITRISE_APPLE_DEVELOPER_TEAM_ID: 6FHH4JXB2X
    opts:
      is_expand: false
