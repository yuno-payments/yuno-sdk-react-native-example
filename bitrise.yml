---
format_version: '23'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native
workflows:
  generateQaVersion:
    description: |
      Generates QA Android APK and uploads to Firebase App Distribution.
      Uses public npm registry (@yuno-payments/yuno-sdk-react-native).
      
      Required Secrets:
      - FIREBASE_TOKEN (Firebase CLI token - get it via: firebase login:ci)
      - FIREBASE_APP_ID (Use: 1:744979953259:android:5e06daf454d662b202232e for com.yunosdkexample)
      
      Optional Secrets:
      - FIREBASE_TESTER_GROUPS (comma-separated group names)
    steps:
    - git-clone@8: {}
    
    - cache-pull@2: {}
    
    - npm@1:
        title: Install NPM Dependencies
        inputs:
        - workdir: "$WORKDIR"
        - command: install
    
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    
    - android-build@1:
        title: Build Android APK (Debug)
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: "$MODULE"
        - variant: "$VARIANT"
    
    - script@1:
        title: Verify APK was created
        inputs:
        - content: |
            #!/bin/bash
            set -e
            
            echo "🔍 Looking for generated APK..."
            if [ -f "$BITRISE_APK_PATH" ]; then
              echo "✅ APK found: $BITRISE_APK_PATH"
              ls -lh "$BITRISE_APK_PATH"
            else
              echo "❌ APK not found at: $BITRISE_APK_PATH"
              echo "Looking for APKs in android/app/build/outputs/apk/..."
              find android/app/build/outputs/apk/ -name "*.apk" || true
              exit 1
            fi
    
    - firebase-app-distribution@0:
        title: Deploy to Firebase App Distribution
        inputs:
        - firebase_token: "$FIREBASE_TOKEN"
        - app: "$FIREBASE_APP_ID"
        - app_path: "$BITRISE_APK_PATH"
        - release_notes: |
            🚀 QA Build - Yuno SDK React Native Example
            
            📦 Build: #$BITRISE_BUILD_NUMBER
            🌿 Branch: $BITRISE_GIT_BRANCH
            📝 Commit: $BITRISE_GIT_COMMIT
            👤 By: $GIT_CLONE_COMMIT_AUTHOR_NAME
            
            Ready for testing! 🧪
        - groups: "$FIREBASE_TESTER_GROUPS"
    
    - deploy-to-bitrise-io@2:
        title: Deploy APK to Bitrise Artifacts
        inputs:
        - deploy_path: "$BITRISE_APK_PATH"
        - is_compress: "false"
    
    - cache-push@2:
        inputs:
        - cache_paths: |
            $HOME/.gradle/caches
            $HOME/.gradle/wrapper
            ./android/.gradle
  
  deploy:
    description: |
      Tests, builds and deploys the app using *Deploy to bitrise.io* Step.

      Next steps:
      - Set up an [Apple service with API key](https://devcenter.bitrise.io/en/accounts/connecting-to-services/connecting-to-an-apple-service-with-api-key.html).
      - Check out [Getting started with React Native apps](https://devcenter.bitrise.io/en/getting-started/getting-started-with-react-native-apps.html).
    steps:
    - git-clone@8: {}
    - npm@1:
        title: npm install
        inputs:
        - workdir: "$WORKDIR"
        - command: install
    - npm@1:
        title: npm test
        inputs:
        - workdir: "$WORKDIR"
        - command: test
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - android-build@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: "$MODULE"
        - variant: "$VARIANT"
    - cocoapods-install@2:
        inputs:
        - is_cache_disabled: 'true'
    - xcode-archive@5:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - distribution_method: "$BITRISE_DISTRIBUTION_METHOD"
        - configuration: Release
        - automatic_code_signing: api-key
    - deploy-to-bitrise-io@2: {}
  build-ipa:
    description: |
      Builds iOS app and generates IPA file using Fastlane.
      
      Simple workflow:
      1. Clone repository
      2. Install dependencies (NPM + CocoaPods)
      3. Setup Node.js for React Native
      4. Install Fastlane
      5. Build and export IPA with Fastlane
      6. Deploy IPA to Bitrise artifacts
    steps:
    - git-clone@8: {}
    
    - cache-pull@2: {}
    
    - npm@1:
        title: Install NPM Dependencies
        inputs:
        - workdir: "$WORKDIR"
        - command: install
    
    - script@1:
        title: Setup Node.js for Xcode
        inputs:
        - content: |
            #!/bin/bash
            set -e
            NODE_PATH=$(command -v node || echo "/opt/homebrew/bin/node")
            mkdir -p ios
            echo "export NODE_BINARY=\"$NODE_PATH\"" > ios/.xcode.env
            envman add --key NODE_OPTIONS --value "--max-old-space-size=4096"
            bash ./scripts/fix-boost-checksum.sh || true
    
    - cocoapods-install@2:
        title: Install CocoaPods
        inputs:
        - podfile_path: ios/Podfile
    
    - script@1:
        title: Install Fastlane
        inputs:
        - content: |
            #!/bin/bash
            set -e
            cd ios
            gem install bundler
            bundle install
    
    - script@1:
        title: Build IPA with Fastlane
        inputs:
        - content: |
            #!/bin/bash
            set -e
            cd ios
            bundle exec fastlane build_ipa
            IPA=$(find ./build -name "*.ipa" | head -1)
            cp "$IPA" "$BITRISE_DEPLOY_DIR/YunoSDKExample.ipa"
            envman add --key BITRISE_IPA_PATH --value "$BITRISE_DEPLOY_DIR/YunoSDKExample.ipa"

    # Step 11: Deploy IPA to Bitrise Artifacts
    - deploy-to-bitrise-io@2:
        title: Deploy IPA to Bitrise Artifacts
        inputs:
        - deploy_path: "$BITRISE_IPA_PATH"
        - is_compress: 'false'

    # Step 12: Push cache
    - cache-push@2:
        inputs:
        - cache_paths: |
            $HOME/.npm
            $HOME/.cocoapods
            ios/Pods

    meta:
      bitrise.io:
        stack: osx-xcode-16.2.x

    envs:
    - APP_STORE_CONNECT_API_KEY_ID: 5GK9MR375D
      opts:
        is_expand: false
    - APP_STORE_CONNECT_ISSUER_ID: fd7f4eef-7bb0-411c-a5f1-06e70c7f6463
      opts:
        is_expand: false

    triggers:
      tag:
      - name:
          regex: "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[a-zA-Z]+)?-[0-9]+-DEV$"

  primary:
    description: |
      Runs tests.

      Next steps:
      - Check out [Getting started with React Native apps](https://devcenter.bitrise.io/en/getting-started/getting-started-with-react-native-apps.html).
    steps:
    - git-clone@8: {}
    - restore-npm-cache@2: {}
    - npm@1:
        title: npm install
        inputs:
        - workdir: "$WORKDIR"
        - command: install
    - npm@1:
        title: npm test
        inputs:
        - workdir: "$WORKDIR"
        - command: test
    - save-npm-cache@1: {}
    - deploy-to-bitrise-io@2: {}
    triggers:
      push:
      - branch: main
      pull_request:
      - source_branch: "*"
meta:
  bitrise.io:
    stack: osx-xcode-16.4.x
    machine_type_id: g2-m1.8core
app:
  envs:
  - WORKDIR: "."
    opts:
      is_expand: false
  - PROJECT_LOCATION: android
    opts:
      is_expand: false
  - MODULE: app
    opts:
      is_expand: false
  - VARIANT: Debug
    opts:
      is_expand: false
  - BITRISE_PROJECT_PATH: ios/YunoSDKExample.xcworkspace
    opts:
      is_expand: false
  - BITRISE_SCHEME: YunoSDKExample
    opts:
      is_expand: false
  - BITRISE_DISTRIBUTION_METHOD: ad-hoc
    opts:
      is_expand: false
